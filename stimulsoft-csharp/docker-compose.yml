# Viewer only — Postgres уже должен быть запущен снаружи.
# cp .env.example .env  →  заполни →  docker compose up --build -d

services:
  viewer:
    build: .
    container_name: stimulsoft_net_viewer
    ports:
      - "${VIEWER_PORT:-8050}:8050"
    # только локальный .env (не ../.env — там лишнее и на Windows ломается)
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8050"
      MRT_PATH: "/data/Report.mrt"
    volumes:
      # Windows: пиши путь со слэшами /  →  C:/data/Report.mrt
      - ${MRT_HOST_PATH:-./reports/Report.mrt}:/data/Report.mrt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
