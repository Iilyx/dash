# Viewer only. Postgres не поднимаем — берём уже существующую БД.
#
# Переменные: ../.env (корень репо) и/или stimulsoft-csharp/.env
# docker compose up --build -d
# http://127.0.0.1:8050/

services:
  viewer:
    build: .
    container_name: stimulsoft_net_viewer
    ports:
      - "${VIEWER_PORT:-8050}:8050"
    # в контейнер как есть (не перезаписываем пустыми ${VAR:-})
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      # только то, что для контейнера фиксировано
      ASPNETCORE_URLS: http://0.0.0.0:8050
      MRT_PATH: /data/Report.mrt
      # если в .env POSTGRES_HOST=127.0.0.1 — из контейнера не достучишься;
      # для Docker задай POSTGRES_HOST=host.docker.internal или полный PG_CONNECTION_STRING
    volumes:
      # путь к .mrt на хосте: MRT_HOST_PATH в .env (рядом с этим compose)
      - ${MRT_HOST_PATH:-./reports/Report.mrt}:/data/Report.mrt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
