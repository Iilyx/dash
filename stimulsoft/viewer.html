<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Stimulsoft Dashboards.js Viewer 2024.3.3</title>
  <link rel="stylesheet" type="text/css" href="/Css/stimulsoft.viewer.office2013.whiteblue.css" />
  <script src="/stimulsoft.reports.js" type="text/javascript"></script>
  <script src="/stimulsoft.dashboards.js" type="text/javascript"></script>
  <script src="/stimulsoft.viewer.js" type="text/javascript"></script>
  <script src="/config.js" type="text/javascript"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c8c8c8; }
    #stiStatus {
      position: fixed; z-index: 99999; left: 0; right: 0; bottom: 0; height: 36px;
      background: #111; color: #0f0; font: 12px/36px monospace;
      padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #stiStatus.err { color: #f66; }
  </style>
</head>
<body>
  <div id="stiStatus">loading…</div>
  <script type="text/javascript">
    (async function () {
      var status = document.getElementById("stiStatus");
      function info(msg, err) {
        console.log("[viewer]", msg);
        status.textContent = msg;
        status.className = err ? "err" : "";
      }

      var cfg = window.__STI__ || {};
      StiOptions.WebServer.url =
        cfg.dataAdapterUrl || window.location.origin + "/data";
      StiOptions.WebServer.encryptData = false;
      try {
        StiOptions.WebServer.checkDataAdaptersVersion = false;
      } catch (e) {}

      if (cfg.licenseKey && Stimulsoft.Base && Stimulsoft.Base.StiLicense) {
        Stimulsoft.Base.StiLicense.key = cfg.licenseKey;
      }

      var options = new Stimulsoft.Viewer.StiViewerOptions();
      options.appearance.fullScreenMode = true;
      try {
        options.appearance.theme =
          Stimulsoft.Viewer.StiViewerTheme.Office2013WhiteBlue;
      } catch (e) {}
      try {
        options.toolbar.showParametersButton = true;
      } catch (e) {}
      try {
        if (Stimulsoft.Viewer.StiParametersPanelPosition) {
          options.appearance.parametersPanelPosition =
            Stimulsoft.Viewer.StiParametersPanelPosition.Top;
        }
      } catch (e) {}
      try {
        options.appearance.parametersPanelMaxHeight = 140;
      } catch (e) {}
      try {
        options.appearance.parametersPanelColumnsCount = 3;
      } catch (e) {}

      var viewer = new Stimulsoft.Viewer.StiViewer(options, "StiViewer", false);

      function bindConn(args) {
        if (cfg.pgConn) {
          args.connectionString = cfg.pgConn;
          try {
            args.database = "PostgreSQL";
          } catch (e) {}
        }
      }
      viewer.onBeginProcessData = bindConn;

      // Форум Stimulsoft: после parameters panel для Dashboard нужен GetPages,
      // иначе холст белый при живых фильтрах (JS 2024.x).
      function hookDashboardGetPages(js) {
        if (!js || js.__stiDashHook) return;
        js.__stiDashHook = true;

        function forceDashboardPages(tag) {
          try {
            var type =
              (js.reportParams && js.reportParams.type) ||
              (js.options && js.options.reportType) ||
              "";
            info("GetPages (" + tag + ") type=" + type);
            if (js.postAction) {
              js.postAction("GetPages");
              js.postAction("ZoomPageWidth");
            }
          } catch (e) {
            console.warn(e);
          }
        }

        if (typeof js.showParametersPanel === "function") {
          var origShow = js.showParametersPanel.bind(js);
          js.showParametersPanel = function (data, jsObject) {
            var ret = origShow(data, jsObject);
            try {
              js.options.isParametersReceived = true;
            } catch (e) {}
            forceDashboardPages("showParametersPanel");
            return ret;
          };
        }

        if (typeof js.InitializeParametersPanel === "function") {
          var origInit = js.InitializeParametersPanel.bind(js);
          js.InitializeParametersPanel = function () {
            var ret = origInit.apply(js, arguments);
            forceDashboardPages("InitializeParametersPanel");
            return ret;
          };
        }

        // после Submit тоже
        if (js.controls && js.controls.parametersPanel && js.controls.parametersPanel.mainButtons) {
          try {
            var btn = js.controls.parametersPanel.mainButtons.submit;
            if (btn && !btn.__stiWrapped) {
              btn.__stiWrapped = true;
              var prev = btn.action;
              btn.action = function () {
                if (typeof prev === "function") prev.apply(this, arguments);
                setTimeout(function () {
                  forceDashboardPages("Submit");
                }, 50);
              };
            }
          } catch (e) {}
        }
      }

      var fromPreview = /(?:\?|&)from=preview(?:&|$)/.test(location.search || "");
      var mrtUrl = fromPreview ? "/dashboard-preview" : "/dashboard";
      var text = await (await fetch(mrtUrl, { cache: "no-store" })).text();

      var report = Stimulsoft.Report.StiReport.createNewDashboard();
      report.load(text);
      report.onBeginProcessData = bindConn;
      // не блокируем первую отрисовку страницы дашборда
      report.requestParameters = false;

      try {
        if (Stimulsoft.Report.StiParametersDisplayMode) {
          report.parametersDisplayMode =
            Stimulsoft.Report.StiParametersDisplayMode.Panel;
        }
      } catch (e) {}

      try {
        var dbs = report.dictionary.databases;
        for (var i = 0; i < (dbs.count || 0); i++) {
          var db = dbs.getByIndex(i);
          if (db && cfg.pgConn) db.connectionString = cfg.pgConn;
        }
      } catch (e) {}

      try {
        var vars = report.dictionary.variables;
        for (var i = 0; i < (vars.count || 0); i++) {
          var v = vars.getByIndex(i);
          if (!v || !String(v.name || "").trim()) continue;
          if (v.requestFromUser || v.showOnParametersPanel) {
            v.requestFromUser = true;
            v.showOnParametersPanel = true;
          }
        }
      } catch (e) {}

      var comps = 0;
      try {
        for (var p = 0; p < (report.pages.count || 0); p++) {
          var page = report.pages.getByIndex(p);
          comps += (page && page.components && page.components.count) || 0;
        }
      } catch (e) {}
      info("comps=" + comps + " → render");
      if (!comps) throw new Error("MRT without components");

      viewer.renderHtml();
      viewer.report = report;

      var n = 0;
      var timer = setInterval(function () {
        n++;
        try {
          if (viewer.jsObject) hookDashboardGetPages(viewer.jsObject);
        } catch (e) {}
        try {
          if (viewer.jsObject && viewer.jsObject.postAction) {
            viewer.jsObject.postAction("GetPages");
          }
        } catch (e) {}
        try {
          var panel =
            viewer.jsObject &&
            viewer.jsObject.controls &&
            viewer.jsObject.controls.parametersPanel;
          var btn = panel && panel.mainButtons && panel.mainButtons.submit;
          if (btn) {
            if (typeof btn.action === "function") btn.action();
            else if (btn.click) btn.click();
          }
        } catch (e) {}
        if (n >= 10) clearInterval(timer);
      }, 400);
    })().catch(function (err) {
      console.error(err);
      status.className = "err";
      status.textContent = String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
