services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      PORT: "8040"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MRT_PATH: /data/dashboard.mrt
    ports:
      - "${DESIGNER_PORT:-8040}:8040"
      - "9615:9615"
    volumes:
      - ${MRT_FILE:-./dashboard.mrt}:/data/dashboard.mrt
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
