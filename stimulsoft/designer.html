<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Stimulsoft Dashboards.js Designer 2024.3.3</title>

  <script src="/stimulsoft.reports.js" type="text/javascript"></script>
  <script src="/stimulsoft.dashboards.js" type="text/javascript"></script>
  <script src="/stimulsoft.viewer.js" type="text/javascript"></script>
  <script src="/stimulsoft.designer.js" type="text/javascript"></script>
  <script src="/stimulsoft.blockly.editor.js" type="text/javascript"></script>
  <script src="/config.js" type="text/javascript"></script>
</head>
<body>
  <div id="designer"></div>
  <script type="text/javascript">
    (async function () {
      var cfg = window.__STI__ || {};

      StiOptions.WebServer.url = cfg.dataAdapterUrl || "http://localhost:9615";
      StiOptions.WebServer.encryptData = false;
      try {
        StiOptions.WebServer.checkDataAdaptersVersion = false;
      } catch (e) {}

      if (cfg.licenseKey && Stimulsoft.Base && Stimulsoft.Base.StiLicense) {
        Stimulsoft.Base.StiLicense.key = cfg.licenseKey;
      }

      var options = new Stimulsoft.Designer.StiDesignerOptions();
      options.appearance.fullScreenMode = true;
      options.toolbar.showPreviewButton = true;

      var designer = new Stimulsoft.Designer.StiDesigner(options, "StiDesigner", false);

      function bindConn(args) {
        if (cfg.pgConn) args.connectionString = cfg.pgConn;
      }
      designer.onBeginProcessData = bindConn;

      // Встроенный Preview часто белый → /viewer со снимком
      designer.onPreviewReport = function (args) {
        args.preventDefault = true;
        var json = args.report.saveToJsonString();
        fetch("/preview-mrt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: json,
        })
          .then(function (r) {
            if (!r.ok) throw new Error("preview save failed");
            window.location = "/viewer?from=preview";
          })
          .catch(function (err) {
            console.error(err);
            window.location = "/viewer";
          });
      };

      console.log("Load dashboard /dashboard");
      var text = await (await fetch("/dashboard", { cache: "no-store" })).text();
      var report = Stimulsoft.Report.StiReport.createNewDashboard();
      report.load(text);
      report.onBeginProcessData = bindConn;
      try {
        report.requestParameters = false;
      } catch (e) {}

      designer.report = report;
      designer.renderHtml("designer");
    })().catch(function (err) {
      console.error(err);
      document.body.textContent = String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
