<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Stimulsoft Dashboards.JS Designer</title>
  <link rel="stylesheet" type="text/css" href="/Css/stimulsoft.viewer.office2013.whiteblue.css" />
  <link rel="stylesheet" type="text/css" href="/Css/stimulsoft.designer.office2013.whiteblue.css" />
  <script src="/stimulsoft.reports.js"></script>
  <script src="/stimulsoft.dashboards.js"></script>
  <script src="/stimulsoft.viewer.js"></script>
  <script src="/stimulsoft.designer.js"></script>
  <script src="/stimulsoft.blockly.editor.js"></script>
  <script src="/config.js"></script>
  <script src="/sti-common.js"></script>
  <style>
    #banner {
      position: fixed; z-index: 99999; left: 0; right: 0; top: 0;
      padding: 8px 12px; background: #1a3a5c; color: #fff;
      font: 13px/1.4 system-ui, sans-serif;
    }
    #banner a { color: #9cf; }
    #designer { padding-top: 36px; }
  </style>
</head>
<body>
  <div id="banner">
    Смотреть дашборд:
    <a href="/viewer" target="_blank">/viewer</a>
  </div>
  <div id="designer"></div>
  <script>
    (async function () {
      var cfg = window.__STI__ || {};
      window.StiApp.applyLicense(cfg);
      window.StiApp.setupAdapter();

      var options = new Stimulsoft.Designer.StiDesignerOptions();
      options.appearance.fullScreenMode = true;
      try {
        if (options.viewerOptions && options.viewerOptions.toolbar)
          options.viewerOptions.toolbar.showParametersButton = false;
      } catch (e) {}

      var designer = new Stimulsoft.Designer.StiDesigner(options, "StiDesigner", false);
      designer.onBeginProcessData = function (args) {
        if (cfg.pgConn) args.connectionString = cfg.pgConn;
      };
      designer.onPreviewReport = function (args) {
        try { args.preventDefault = true; } catch (e) {}
        window.open("/viewer", "_blank");
      };
      designer.onSaveReport = function (args) {
        args.preventDefault = true;
        fetch("/dashboard", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: args.report.saveToJsonString(),
        });
      };
      designer.onSaveAsReport = designer.onSaveReport;
      designer.renderHtml("designer");

      var loaded = await window.StiApp.loadReport(cfg);
      designer.report = loaded.report;
      document.getElementById("banner").innerHTML +=
        " · " + loaded.mode +
        " pages=" + loaded.stats.pages +
        " comps=" + loaded.stats.comps;
    })().catch(function (e) {
      document.getElementById("banner").textContent = String(e && e.message ? e.message : e);
    });
  </script>
</body>
</html>
