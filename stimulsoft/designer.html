<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Stimulsoft Dashboards.JS Designer</title>
  <script src="/stimulsoft.reports.js"></script>
  <script src="/stimulsoft.dashboards.js"></script>
  <script src="/stimulsoft.viewer.js"></script>
  <script src="/stimulsoft.designer.js"></script>
  <script src="/stimulsoft.blockly.editor.js"></script>
  <script src="/config.js"></script>
</head>
<body>
  <div id="designer"></div>
  <script>
    (async function () {
      var cfg = window.__STI__ || {};
      var dataUrl = window.location.origin + "/data";

      if (cfg.licenseKey) {
        try {
          if (Stimulsoft.Base && Stimulsoft.Base.StiLicense)
            Stimulsoft.Base.StiLicense.key = cfg.licenseKey;
        } catch (e) {}
      }

      // движок 2024.3.3 читает global StiOptions.WebServer
      StiOptions.WebServer.url = dataUrl;
      StiOptions.WebServer.encryptData = false;
      StiOptions.WebServer.checkDataAdaptersVersion = false;
      console.log("[sti] WebServer.url =", StiOptions.WebServer.url);

      function patchReport(report) {
        // иначе Preview ждёт Submit по RequestFromUser и холст пустой
        report.requestParameters = false;

        try {
          var dbs = report.dictionary.databases;
          var n = dbs.count || 0;
          console.log("[sti] databases =", n);
          for (var i = 0; i < n; i++) {
            var db = dbs.getByIndex(i);
            if (!db) continue;
            console.log("[sti] db", i, db.name, db.serviceName || db.ident || "");
            if (cfg.pgConn) db.connectionString = cfg.pgConn;
          }
          if (!n) {
            console.error(
              "[sti] В .mrt нет живых Databases (scrubbed). Подставь полный .mrt в MRT_PATH / dashboard.mrt"
            );
          }
        } catch (e) {
          console.warn("[sti] patchReport", e);
        }

        report.onBeginProcessData = function (args) {
          console.log("[sti] BeginProcessData", args.command, args.database, args.dataSource);
          if (cfg.pgConn) args.connectionString = cfg.pgConn;
        };
      }

      var options = new Stimulsoft.Designer.StiDesignerOptions();
      options.appearance.fullScreenMode = true;
      var designer = new Stimulsoft.Designer.StiDesigner(options, "StiDesigner", false);

      designer.onBeginProcessData = function (args) {
        console.log("[sti] designer BeginProcessData", args.command, args.database);
        if (cfg.pgConn) args.connectionString = cfg.pgConn;
      };

      // перед Preview в дизайнере
      designer.onPreviewReport = function (args) {
        patchReport(args.report);
      };

      designer.onSaveReport = function (args) {
        args.preventDefault = true;
        fetch("/dashboard", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: args.report.saveToJsonString(),
        });
      };
      designer.onSaveAsReport = designer.onSaveReport;

      designer.renderHtml("designer");

      // явная загрузка JSON — без гонки loadFile
      var resp = await fetch("/dashboard", { cache: "no-store" });
      if (!resp.ok) {
        console.error("[sti] /dashboard", resp.status);
        return;
      }
      var json = await resp.text();

      var report = Stimulsoft.Report.StiReport.createNewDashboard();
      report.load(json);
      patchReport(report);
      designer.report = report;
    })();
  </script>
</body>
</html>
