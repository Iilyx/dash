services:
  postgres:
    image: postgres:16
    container_name: mcp_pg_bi_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata67:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

  designer:
    build: ./sti
    container_name: mcp_pg_bi_designer
    env_file:
      - .env
    environment:
      # внутри сети compose всегда postgres:5432
      PORT: "8040"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MRT_PATH: /workspace/${MRT_FILE:-test.mrt}
    ports:
      - "${VIEWER_PORT:-8040}:8040"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata67:
